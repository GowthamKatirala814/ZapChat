# ZapChat data tier for local development.
#
# This file provides MongoDB and nothing else, on purpose. The six services and the
# gateway run on the host through `scripts/start-backend.ps1`, which gives you hot
# reload, attachable debugging and readable logs — the things you actually want while
# developing. Containerising them would buy isolation you do not need locally and cost
# a rebuild on every edit.
#
# So the local topology is:
#
#     frontend (vite :5173)  ->  gateway (:5000)  ->  services (:5111 …)  ->  mongo (:27017)
#              host                   host                  host              this file
#
# There is no SQL Server here and none anywhere else: MongoDB is the only database the
# platform uses.
#
# Skip this file entirely if you already run MongoDB as a native service — the two bind
# the same port, so use one or the other.
#
#     docker compose up -d mongo         # just the database
#     docker compose up -d               # database + web UI
#     docker compose down                # stop, keep the data
#     docker compose down -v             # stop and delete the data
services:
  mongo:
    image: mongo:8
    container_name: zapchat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume, so `docker compose down` does not wipe your development data.
      - zapchat-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    # A standalone mongod, deliberately — no replica set. Multi-document transactions
    # are therefore unavailable, and nothing in the platform needs them: every
    # operation that must be atomic is scoped to a single document ($inc on counters,
    # $addToSet/$pull on reactions, positional array filters). If you ever do need
    # transactions, add `command: ["--replSet","rs0"]` here and run rs.initiate() once.

  # Optional. Browse the six zapchat_* databases at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: zapchat-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      # Local only, on a database with no credentials. Never expose this beyond localhost.
      ME_CONFIG_BASICAUTH: "false"

volumes:
  zapchat-mongo-data:
